<!DOCTYPE html>
<html>
<head>
    <title>DOM Manipulation and Event Handling</title>

    <style>
        body{
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }

        button{
            padding: 8px 15px;
            margin: 5px;
        }

        #para{
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1 id="heading">Welcome to JavaScript DOM</h1>

    <p id="para">
        This is a paragraph for DOM Manipulation.
    </p>

    <input type="text" id="textInput" placeholder="Enter new heading">

    <br><br>

    <button id="changeText">Change Heading</button>
    <button id="changeColor">Change Background</button>
    <button id="fontSize">Increase Font Size</button>
    <button id="togglePara">Show/Hide Paragraph</button>
    <button id="reset">Reset</button>

    <script>

        // Change Heading Text
        document.getElementById("changeText")
        .addEventListener("click", function(){

            let text =
            document.getElementById("textInput").value;

            document.getElementById("heading").innerHTML = text;
        });

        // Change Background Color
        document.getElementById("changeColor")
        .addEventListener("click", function(){

            document.body.style.backgroundColor = "lightblue";
        });

        // Increase Font Size
        document.getElementById("fontSize")
        .addEventListener("click", function(){

            document.getElementById("heading").style.fontSize = "40px";
        });

        // Show / Hide Paragraph
        document.getElementById("togglePara")
        .addEventListener("click", function(){

            let para = document.getElementById("para");

            if(para.style.display == "none"){
                para.style.display = "block";
            }
            else{
                para.style.display = "none";
            }
        });

        // Reset Page
        document.getElementById("reset")
        .addEventListener("click", function(){

            document.getElementById("heading").innerHTML =
            "Welcome to JavaScript DOM";

            document.getElementById("heading").style.fontSize =
            "32px";

            document.body.style.backgroundColor = "white";

            document.getElementById("para").style.display =
            "block";

            document.getElementById("textInput").value = "";
        });

    </script>

</body>
</html>
